<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 565" role="img" aria-label="Illustrative midpoint range from cost and value ranges with fixed openings" style="background:#f4ead2;color:#211a0e;font-family:Spectral,Georgia,serif"><title>Illustrative midpoint range from cost and value ranges with fixed openings</title><rect width="900" height="565" fill="#f4ead2"/><g fill="#211a0e"><text x="65" y="35" font-size="25" >Where could the midpoint be?</text><text x="65" y="65" font-size="16" >Explore independent uniform ranges. Fixed opening offers stay at seller 95 and buyer 55.</text><text x="440" y="413" font-size="16" text-anchor="middle">Price</text><line x1="148.33333333333331" y1="140" x2="315" y2="140" stroke="#9c3520" stroke-width="16" stroke-linecap="round"/><text x="65" y="120" font-size="16" >Seller cost: 40 to 60</text><circle cx="148.33333333333331" cy="140" r="5" fill="#9c3520" tabindex="0" role="img" aria-label="Seller cost minimum 40" data-detail="Seller cost minimum 40" ><title>Seller cost minimum 40</title></circle><circle cx="315" cy="140" r="5" fill="#9c3520" tabindex="0" role="img" aria-label="Seller cost maximum 60" data-detail="Seller cost maximum 60" ><title>Seller cost maximum 60</title></circle><line x1="565" y1="205" x2="731.6666666666666" y2="205" stroke="#2f527a" stroke-width="16" stroke-linecap="round"/><text x="65" y="185" font-size="16" >Buyer value: 90 to 110</text><circle cx="565" cy="205" r="5" fill="#2f527a" tabindex="0" role="img" aria-label="Buyer value minimum 90" data-detail="Buyer value minimum 90" ><title>Buyer value minimum 90</title></circle><circle cx="731.6666666666666" cy="205" r="5" fill="#2f527a" tabindex="0" role="img" aria-label="Buyer value maximum 110" data-detail="Buyer value maximum 110" ><title>Buyer value maximum 110</title></circle><line x1="356.6666666666667" y1="270" x2="523.3333333333334" y2="270" stroke="#97742a" stroke-width="16" stroke-linecap="round"/><text x="65" y="250" font-size="16" >Possible midpoint: 65 to 85</text><circle cx="356.6666666666667" cy="270" r="5" fill="#97742a" tabindex="0" role="img" aria-label="Possible midpoint minimum 65" data-detail="Possible midpoint minimum 65" ><title>Possible midpoint minimum 65</title></circle><circle cx="523.3333333333334" cy="270" r="5" fill="#97742a" tabindex="0" role="img" aria-label="Possible midpoint maximum 85" data-detail="Possible midpoint maximum 85" ><title>Possible midpoint maximum 85</title></circle><line x1="273.33333333333337" y1="315" x2="606.6666666666666" y2="315" stroke="#dcc8a0" stroke-width="4"/><circle cx="273.33333333333337" cy="315" r="8" fill="#2f527a" tabindex="0" role="img" aria-label="Fixed buyer opening: 55" data-detail="Fixed buyer opening: 55" ><title>Fixed buyer opening: 55</title></circle><circle cx="606.6666666666666" cy="315" r="8" fill="#9c3520" tabindex="0" role="img" aria-label="Fixed seller opening: 95" data-detail="Fixed seller opening: 95" ><title>Fixed seller opening: 95</title></circle><text x="273.33333333333337" y="347" font-size="15" text-anchor="middle">Buyer 55</text><text x="606.6666666666666" y="347" font-size="15" text-anchor="middle">Seller 95</text><text x="65" y="435" font-size="20" >Midpoint range 65 to 85; expected midpoint 75.</text><text x="65" y="471" font-size="18" >Minimum available surplus v_min−c_max = 30.</text><text x="65" y="507" font-size="15" >This changes the possible midpoint, not a measured training outcome or an optimal opening.</text><text x="65" y="536" font-size="15" >Positive reward at every possible midpoint: seller p &gt; maximum midpoint; buyer p &lt; minimum.</text></g></svg>