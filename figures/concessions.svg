<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" role="img" aria-label="Illustrative opponent concession curves with the implemented offer rule" style="background:#f4ead2;color:#211a0e;font-family:Spectral,Georgia,serif"><title>Illustrative opponent concession curves with the implemented offer rule</title><rect width="900" height="580" fill="#f4ead2"/><g fill="#211a0e"><text x="65" y="35" font-size="25" >Three sequences of offers</text><text x="65" y="65" font-size="17" >Illustration: seller opens at 110, cost 50, deadline at round 6.</text><line x1="65" y1="375" x2="815" y2="375" stroke="#dcc8a0" /><text x="56" y="380" font-size="14" text-anchor="end">40</text><line x1="65" y1="310" x2="815" y2="310" stroke="#dcc8a0" /><text x="56" y="315" font-size="14" text-anchor="end">60</text><line x1="65" y1="245" x2="815" y2="245" stroke="#dcc8a0" /><text x="56" y="250" font-size="14" text-anchor="end">80</text><line x1="65" y1="180" x2="815" y2="180" stroke="#dcc8a0" /><text x="56" y="185" font-size="14" text-anchor="end">100</text><line x1="65" y1="115" x2="815" y2="115" stroke="#dcc8a0" /><text x="56" y="120" font-size="14" text-anchor="end">120</text><line x1="65" y1="375" x2="65" y2="380" stroke="#786a4d" /><text x="65" y="399" font-size="14" text-anchor="middle">1</text><line x1="215" y1="375" x2="215" y2="380" stroke="#786a4d" /><text x="215" y="399" font-size="14" text-anchor="middle">2</text><line x1="365" y1="375" x2="365" y2="380" stroke="#786a4d" /><text x="365" y="399" font-size="14" text-anchor="middle">3</text><line x1="515" y1="375" x2="515" y2="380" stroke="#786a4d" /><text x="515" y="399" font-size="14" text-anchor="middle">4</text><line x1="665" y1="375" x2="665" y2="380" stroke="#786a4d" /><text x="665" y="399" font-size="14" text-anchor="middle">5</text><line x1="815" y1="375" x2="815" y2="380" stroke="#786a4d" /><text x="815" y="399" font-size="14" text-anchor="middle">6</text><text x="440" y="423" font-size="16" text-anchor="middle">Action round k</text><polyline points="65,147.5 215,147.5 365,150.75 515,163.75 665,212.5 815,342.5" fill="none" stroke="#9c3520" stroke-width="2.5" /><circle cx="65" cy="147.5" r="2.8" fill="#9c3520" tabindex="0" role="img" aria-label="Boulware; step 1: 110.000" data-detail="Boulware; step 1: 110.000" ><title>Boulware; step 1: 110.000</title></circle><circle cx="215" cy="147.5" r="2.8" fill="#9c3520" tabindex="0" role="img" aria-label="Boulware; step 2: 110.000" data-detail="Boulware; step 2: 110.000" ><title>Boulware; step 2: 110.000</title></circle><circle cx="365" cy="150.75" r="2.8" fill="#9c3520" tabindex="0" role="img" aria-label="Boulware; step 3: 109.000" data-detail="Boulware; step 3: 109.000" ><title>Boulware; step 3: 109.000</title></circle><circle cx="515" cy="163.75" r="2.8" fill="#9c3520" tabindex="0" role="img" aria-label="Boulware; step 4: 105.000" data-detail="Boulware; step 4: 105.000" ><title>Boulware; step 4: 105.000</title></circle><circle cx="665" cy="212.5" r="2.8" fill="#9c3520" tabindex="0" role="img" aria-label="Boulware; step 5: 90.000" data-detail="Boulware; step 5: 90.000" ><title>Boulware; step 5: 90.000</title></circle><circle cx="815" cy="342.5" r="2.8" fill="#9c3520" tabindex="0" role="img" aria-label="Boulware; step 6: 50.000" data-detail="Boulware; step 6: 50.000" ><title>Boulware; step 6: 50.000</title></circle><polyline points="65,147.5 215,261.25 365,290.5 515,313.25 665,329.5 815,342.5" fill="none" stroke="#2f527a" stroke-width="2.5" /><circle cx="65" cy="147.5" r="2.8" fill="#2f527a" tabindex="0" role="img" aria-label="Conceder; step 1: 110.000" data-detail="Conceder; step 1: 110.000" ><title>Conceder; step 1: 110.000</title></circle><circle cx="215" cy="261.25" r="2.8" fill="#2f527a" tabindex="0" role="img" aria-label="Conceder; step 2: 75.000" data-detail="Conceder; step 2: 75.000" ><title>Conceder; step 2: 75.000</title></circle><circle cx="365" cy="290.5" r="2.8" fill="#2f527a" tabindex="0" role="img" aria-label="Conceder; step 3: 66.000" data-detail="Conceder; step 3: 66.000" ><title>Conceder; step 3: 66.000</title></circle><circle cx="515" cy="313.25" r="2.8" fill="#2f527a" tabindex="0" role="img" aria-label="Conceder; step 4: 59.000" data-detail="Conceder; step 4: 59.000" ><title>Conceder; step 4: 59.000</title></circle><circle cx="665" cy="329.5" r="2.8" fill="#2f527a" tabindex="0" role="img" aria-label="Conceder; step 5: 54.000" data-detail="Conceder; step 5: 54.000" ><title>Conceder; step 5: 54.000</title></circle><circle cx="815" cy="342.5" r="2.8" fill="#2f527a" tabindex="0" role="img" aria-label="Conceder; step 6: 50.000" data-detail="Conceder; step 6: 50.000" ><title>Conceder; step 6: 50.000</title></circle><polyline points="65,228.75 215,228.75 365,228.75 515,228.75 665,228.75 815,228.75" fill="none" stroke="#4f6b3f" stroke-width="2.5" /><circle cx="65" cy="228.75" r="2.8" fill="#4f6b3f" tabindex="0" role="img" aria-label="TIOLI; step 1: 85.000" data-detail="TIOLI; step 1: 85.000" ><title>TIOLI; step 1: 85.000</title></circle><circle cx="215" cy="228.75" r="2.8" fill="#4f6b3f" tabindex="0" role="img" aria-label="TIOLI; step 2: 85.000" data-detail="TIOLI; step 2: 85.000" ><title>TIOLI; step 2: 85.000</title></circle><circle cx="365" cy="228.75" r="2.8" fill="#4f6b3f" tabindex="0" role="img" aria-label="TIOLI; step 3: 85.000" data-detail="TIOLI; step 3: 85.000" ><title>TIOLI; step 3: 85.000</title></circle><circle cx="515" cy="228.75" r="2.8" fill="#4f6b3f" tabindex="0" role="img" aria-label="TIOLI; step 4: 85.000" data-detail="TIOLI; step 4: 85.000" ><title>TIOLI; step 4: 85.000</title></circle><circle cx="665" cy="228.75" r="2.8" fill="#4f6b3f" tabindex="0" role="img" aria-label="TIOLI; step 5: 85.000" data-detail="TIOLI; step 5: 85.000" ><title>TIOLI; step 5: 85.000</title></circle><circle cx="815" cy="228.75" r="2.8" fill="#4f6b3f" tabindex="0" role="img" aria-label="TIOLI; step 6: 85.000" data-detail="TIOLI; step 6: 85.000" ><title>TIOLI; step 6: 85.000</title></circle><text x="65" y="453" font-size="16" fill="#9c3520">Boulware e=0.2</text><text x="300" y="453" font-size="16" fill="#2f527a">Conceder e=3</text><text x="535" y="453" font-size="16" fill="#4f6b3f">TIOLI threshold=85</text><text x="65" y="493" font-size="16" >Targets are integer prices: round(110 + (50−110) × ((k−1)/5)^(1/e)).</text><text x="65" y="523" font-size="15" >A bot accepts a standing offer at least as good as its next target.</text><text x="65" y="550" font-size="15" >Time bots also accept at their reservation at the deadline. These curves are examples, not data.</text></g></svg>