[project]
name = "bargaining-post-training"
version = "0.1.0"
description = "Code and archived evidence for First Experiments in Bargaining Post-Training"
requires-python = ">=3.12"
dependencies = ["verifiers==0.2.1.dev51", "datasets==4.6.1"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["market"]
py-modules = ["rlvr_bargain"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
